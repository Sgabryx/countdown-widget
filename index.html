<!DOCTYPE html>
<html lang="it">
<head>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Widget</title>

<style>
html, body {
    background: transparent !important;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Roboto Mono", monospace;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 0;
}


.container {
    background: linear-gradient(135deg, #f0e7cd, #f7d1e3);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    width: 400px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    position:relative;
    transition: background 0.4s ease, box-shadow 0.4s ease;
}

h1 { margin-bottom: 20px; }

button {
    padding: 10px 15px;
    font-size: 15px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    margin-top: 10px;
}

.set-btn {
    background-color: #F1A22E;
    color: #4A0000;
}

.reset-btn {
    background-color: #8e0f0f;
    color: white;
}

.countdown {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
    color: #333;
    transition: opacity 0.3s ease, transform 0.3s ease;
}

/* CALENDARIO */

.calendar {
    width: 360px;
    background: rgba(255, 249, 249, 0.95);
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    padding: 20px;
    border: 1px solid #e2e8f0;
    margin-top:20px;
    
    opacity: 0;
    transform: translateY(-15px) scale(0.98);
    pointer-events: none;
    transition: 
        opacity 0.35s ease,
        transform 0.35s ease;
}

.calendar.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}


.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.calendar-header button {
    background: none;
    border: none;
    color: #5b3b4b;
    font-size: 1.4em;
    cursor: pointer;
}

.month {
    font-weight: 600;
    font-size: 1.3em;
    color: #5b3b4b;
}

.weekdays, .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
}

.weekdays {
    font-weight: bold;
    color: #8d663d;
}

.days {
    gap: 4px;
    margin-top: 10px;
}

.day {
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: 
        background 0.2s ease,
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.day:active {
    transform: scale(0.92);
}

.day:hover {
    background: #ead1dc;
    transform: translateY(-2px);
}


.today {
    background: #F1A22E;
    font-weight: bold;
}

.selected {
    background: #6366f1;
    color: white;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <h1>Quando rivedo Pisi?</h1>

    <div id="selectedDateDisplay" 
         style="margin-bottom:10px; font-weight:bold; color:#a21831;">
    </div>

    <button class="set-btn" onclick="openCalendar()">Seleziona Data</button>

    <div class="countdown" id="countdownDisplay">
        Nessuna data selezionata
    </div>

    <button class="reset-btn" onclick="resetDate()">Reimposta</button>

    <!-- CALENDARIO INTEGRATO -->
    <div class="calendar" id="calendar" style="position:relative;">

        <button onclick="closeCalendar()" 
            style="
                position:absolute;
                top: -15px;
                right: -10px;
                background: rgba(154, 151, 151, 0.356);
                color:#8e0f0f;
                border:none;
                border-radius:50%;
                width: 30px;
                height:30px;
                cursor:pointer;
                font-weight:bold;
                z-index: 10;
                display:flex;
                justify-content:center;
                align-items:center;
                font-size:16px;
            ">
            ❌
        </button>
        <div class="calendar-header">
            <button id="prev-month">❮</button>
            <div class="month" id="month"></div>
            <button id="next-month">❯</button>
        </div>

        <div class="weekdays">
            <div>Lun</div><div>Mar</div><div>Mer</div>
            <div>Gio</div><div>Ven</div><div>Sab</div><div>Dom</div>
        </div>
        

        <div class="days" id="days"></div>
    </div>

    
</div>

<script>
const display = document.getElementById("countdownDisplay");
const selectedDateDisplay = document.getElementById("selectedDateDisplay");
const calendar = document.getElementById("calendar");

window.onload = function() {
    const savedDate = localStorage.getItem("countdownDate");
    if (savedDate) {
        updateCountdown(savedDate);
    }
};

function openCalendar() {
    calendar.classList.add("show");
    setTimeout(sendHeightToParent, 350);
}


function updateCountdown(targetDate) {

    const today = new Date();
    const endDate = new Date(targetDate);

    const formatted = endDate.toLocaleDateString("it-IT", {
        day: "2-digit",
        month: "long",
        year: "numeric"
    });

    selectedDateDisplay.textContent = formatted;

    const diffTime = endDate - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    display.style.opacity = 0;
    display.style.transform = "translateY(5px)";


    if (diffDays < 0) {
        display.textContent = "La data è già passata.";
    } else if (diffDays === 0) {
        display.textContent = "È oggi 🥳❤";
    } else if (diffDays <= 7) {
        display.textContent = "Manca meno di una settimana 😍";
    } else {
        display.textContent = "Mancano " + diffDays + " giorni 😢";
    }

    setTimeout(() => {
        display.style.opacity = 1;
        display.style.transform = "translateY(0)";
    }, 50);

}

function resetDate() {
    localStorage.removeItem("countdownDate");
    display.textContent = "Nessuna data selezionata";
    selectedDateDisplay.textContent = "";
    calendar.classList.remove("show");
    setTimeout(sendHeightToParent, 100);
}

/* ---------------- CALENDARIO ---------------- */

const monthNames = [
"Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno",
"Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"
];

let currentDate = new Date();
const daysContainer = document.getElementById("days");
const monthDisplay = document.getElementById("month");

function renderCalendar(date) {
    daysContainer.innerHTML = "";
    const year = date.getFullYear();
    const month = date.getMonth();
    monthDisplay.textContent = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const start = (firstDay + 6) % 7;

    for (let i = 0; i < start; i++) {
        daysContainer.appendChild(document.createElement("div"));
    }

    const today = new Date();

    for (let i = 1; i <= lastDate; i++) {
        const day = document.createElement("div");
        day.classList.add("day");
        day.textContent = i;

        if (
            i === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
        ) {
            day.classList.add("today");
        }

        day.addEventListener("click", () => selectDate(year, month, i));
        daysContainer.appendChild(day);
    }
}

function selectDate(year, month, day) {

    const formattedMonth = String(month + 1).padStart(2, "0");
    const formattedDay = String(day).padStart(2, "0");

    const selected = `${year}-${formattedMonth}-${formattedDay}`;

    localStorage.setItem("countdownDate", selected);
    updateCountdown(selected);
    calendar.classList.remove("show");
    setTimeout(sendHeightToParent, 350);

}

document.getElementById("prev-month").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar(currentDate);
});

document.getElementById("next-month").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar(currentDate);
});

renderCalendar(currentDate);

function closeCalendar() {
    calendar.classList.remove("show");
    setTimeout(sendHeightToParent, 350);
}

function sendHeightToParent() {
    const height = document.documentElement.scrollHeight;
    window.parent.postMessage(
        { notionWidgetHeight: height },
        "*"
    );
}

// Osserva cambiamenti nel DOM
const resizeObserver = new ResizeObserver(() => {
    sendHeightToParent();
});

resizeObserver.observe(document.body);

// Invio iniziale
window.addEventListener("load", sendHeightToParent);


</script>

</body>
</html>
